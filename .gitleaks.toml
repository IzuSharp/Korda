# Retain all upstream rules and the full-history scan. These narrowly matched values
# are public SHA-256 identities of the locked Design inputs, not credentials.
[extend]
useDefault = true

[[allowlists]]
description = "Exact public Design JSON/header digests in Task-02 provenance records"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^(src|tests)/(Interop\.(Negotiation|Errors)|Data\.(Transactions|Postgres|Sqlite|Streaming)|Generators\.Model|Query\.Binding)/(design-inputs|public-api\.expected)\.json$''']
regexTarget = "secret"
regexes = [
  '''^d3e989c4f8732f2514c66a2c1ecf038b460fc29e3581d0b36855612751e974e4$''',
  '''^6d79a3d030ec429e4706f6012d4e9f876ddc35307d4b4c814fc18d5100b4c6e2$''',
]

[[allowlists]]
description = "Literal local NuGet source name in the A02 package fixture"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^tests/Interop\.Negotiation/verify\.py$''']
regexTarget = "line"
regexes = ['''^\s*ET\.SubElement\(sources, "add", key="a02-fixtures", value=str\(feed\)\)\s*$''']

[[allowlists]]
description = "Exact public Design API/header SHA-256 identities in reviewed Task-03 component inputs"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^src/(Analyzers|Generators\.(CSharp|Rust)|Build\.Integration|Verification\.Compatibility)/design-inputs\.json$''', '''^src/Interop\.Memory/public-api\.expected\.json$''']
regexTarget = "secret"
regexes = [
  '''^d3e989c4f8732f2514c66a2c1ecf038b460fc29e3581d0b36855612751e974e4$''',
  '''^6d79a3d030ec429e4706f6012d4e9f876ddc35307d4b4c814fc18d5100b4c6e2$''',
]

[[allowlists]]
description = "Exact public server ABI header SHA-256 pinned at Design c62cdb8 in A13/A22"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^src/(Build\.Integration|Verification\.Compatibility)/design-inputs\.json$''']
regexTarget = "secret"
regexes = ['''^f7316b35bfb8cce5cb4fded82a0907e602626c4e9e54ff18d99fe242f2b4b681$''']

[[allowlists]]
description = "Exact public locked Design API/header SHA-256 identities in Task-04 component provenance"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^src/(Interop\.(Callbacks|Async|Execution)|Engines\.(SyncProof|AsyncProof)|Packaging\.(Linux|Release)|Tooling\.EngineScaffold|Verification\.(ExtensionProof|Interop))/design-inputs\.json$''']
regexTarget = "secret"
regexes = [
  '''^6d79a3d030ec429e4706f6012d4e9f876ddc35307d4b4c814fc18d5100b4c6e2$''',
  '''^d3e989c4f8732f2514c66a2c1ecf038b460fc29e3581d0b36855612751e974e4$''',
  '''^f7316b35bfb8cce5cb4fded82a0907e602626c4e9e54ff18d99fe242f2b4b681$''',
]

[[allowlists]]
description = "Exact public locked Design API/header SHA-256 identities in B16 provenance"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^src/Server\.Streaming/design-inputs\.json$''']
regexTarget = "secret"
regexes = [
  '''^d3e989c4f8732f2514c66a2c1ecf038b460fc29e3581d0b36855612751e974e4$''',
  '''^6d79a3d030ec429e4706f6012d4e9f876ddc35307d4b4c814fc18d5100b4c6e2$''',
  '''^f7316b35bfb8cce5cb4fded82a0907e602626c4e9e54ff18d99fe242f2b4b681$''',
]

[[allowlists]]
description = "Literal public transaction recovery identifier in the B04 guide"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^docs/guides/data-nativehost\.md$''']
regexTarget = "secret"
regexes = ['''^application-operation-123$''']

[[allowlists]]
description = "Exact invalid duplicate tracestate syntax in the B20 negative fixture"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^native/server/diagnostics/src/tests\.rs$''']
regexTarget = "line"
regexes = ['''^\s*"vendor=secret,vendor=duplicate",\s*$''']
