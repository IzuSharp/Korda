[workspace]
members = ["native/hello-world", "native/interop/memory", "native/interop/lifetime", "native/interop/abi", "native/database/interfaces", "native/interop/errors", "tests/Interop.Errors/native", "native/database/codecs", "native/database/transactions", "native/database/postgres", "native/database/sqlite", "native/database/streaming", "native/database/binding"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
repository = "https://github.com/IzuSharp/NativeWeave"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
# Keep unwinding enabled so the ABI guard can contain recoverable panics.
panic = "unwind"
