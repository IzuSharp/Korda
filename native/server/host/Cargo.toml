[package]
name = "nativeweave-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
nativeweave-interop-abi = { path = "../../interop/abi" }
nativeweave-interop-async = { path = "../../interop/async" }
nativeweave-interop-errors = { path = "../../interop/errors" }
nativeweave-server-streaming = { path = "../streaming" }
bytes = "=1.12.1"
http = "=1.5.0"
http-body = "=1.1.0"
http-body-util = "=0.1.3"
hyper = { version = "=1.12.0", features = ["server", "client", "http1", "http2"] }
hyper-util = { version = "=0.1.21", features = ["tokio", "server-auto", "service"] }
tokio = { version = "=1.54.1", features = ["rt", "net", "sync", "time", "macros", "io-util"] }
tower = { version = "=0.5.3", features = ["util"] }
axum = { version = "=0.8.9", default-features = false, features = ["tokio", "http1", "http2"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "=0.26.4", default-features = false, features = ["ring", "tls12"] }
rustls-pemfile = "=2.2.0"
form_urlencoded = "=1.2.2"
percent-encoding = "=2.3.2"
matchit = "=0.8.4"
futures-util = { version = "=0.3.34", default-features = false, features = ["std", "async-await"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
