[package]
name = "nativeweave-protocol-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
publish = false

[dependencies]
nativeweave-server-streaming = { path = "../../server/streaming" }
rmcp = { version = "=3.10.0", default-features = false, features = ["server", "transport-streamable-http-server"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
bytes = "=1.12.1"
http = "=1.5.0"
http-body = "=1.1.0"
http-body-util = "=0.1.3"
tokio = { version = "=1.54.1", features = ["sync", "time"] }
tokio-util = "=0.7.20"
tower = { version = "=0.5.3", features = ["util"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
[lints.clippy]
undocumented_unsafe_blocks = "deny"
