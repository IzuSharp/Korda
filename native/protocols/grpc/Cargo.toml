[package]
name = "nativeweave-protocols-grpc"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
publish = false

[dependencies]
bytes = "=1.12.1"
http = "=1.5.0"
http-body = "=1.1.0"
http-body-util = "=0.1.3"
futures-core = "=0.3.34"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", features = ["sync", "time"] }
tonic = { version = "=0.14.9", default-features = false, features = ["codegen"] }
nativeweave-server-streaming = { path = "../../server/streaming" }

[dev-dependencies]
tokio = { version = "=1.54.1", features = ["rt", "macros"] }
tower = { version = "=0.5.3", features = ["util"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
[lints.clippy]
undocumented_unsafe_blocks = "deny"
