[package]
name = "nativeweave-engine-syncproof"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
miniz_oxide = { version = "=0.9.1", default-features = false, features = ["with-alloc"] }
nativeweave-interop-abi = { path = "../../interop/abi" }
nativeweave-interop-errors = { path = "../../interop/errors" }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"

[[bin]]
name = "nativeweave-syncproof-direct"
path = "src/bin/direct.rs"
