[package]
name = "nativeweave-engine-asyncproof"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
nativeweave-interop-abi = { path = "../../interop/abi" }
nativeweave-interop-errors = { path = "../../interop/errors" }
nativeweave-interop-callbacks = { path = "../../interop/callbacks" }
nativeweave-interop-async = { path = "../../interop/async" }
bytes = "=1.12.1"
hyper = { version = "=1.12.0", features = ["server", "client", "http1"] }
hyper-util = { version = "=0.1.21", features = ["tokio"] }
tokio = { version = "=1.54.1", features = ["rt", "net", "sync", "time", "macros", "io-util"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"

[[bin]]
name = "nativeweave-asyncproof-direct"
path = "src/bin/direct.rs"
