[package]
name = "nativeweave-interop-async"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = []
conformance = ["dep:nativeweave-interop-memory"]

[dependencies]
nativeweave-interop-abi = { path = "../abi" }
nativeweave-interop-errors = { path = "../errors" }
nativeweave-interop-memory = { path = "../memory", optional = true }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
