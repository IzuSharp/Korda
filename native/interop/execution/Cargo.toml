[package]
name = "nativeweave-interop-execution"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false
license = "MIT"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = []
conformance = ["dep:nativeweave-interop-async"]

[dependencies]
tokio = { version = "=1.54.1", default-features = false, features = ["rt-multi-thread", "sync"] }
nativeweave-interop-abi = { path = "../abi" }
nativeweave-interop-errors = { path = "../errors" }
nativeweave-interop-async = { path = "../async", optional = true }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
