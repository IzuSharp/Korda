[package]
name = "nativeweave-data-streaming"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
nativeweave-data-contracts = { path = "../interfaces" }
nativeweave-data-codecs = { path = "../codecs" }
futures-util = { version = "=0.3.34", default-features = false, features = ["std", "async-await"] }
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "sqlite", "chrono", "uuid", "rust_decimal", "json"] }
tokio = { version = "=1.54.1", features = ["rt"] }

[dev-dependencies]
tokio = { version = "=1.54.1", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "net"] }
serde_json = "=1.0.154"

[lints]
workspace = true
