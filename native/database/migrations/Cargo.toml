[package]
name = "nativeweave-data-migrations"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
publish = false
description = "Explicit SQLx migration administration with dedicated connection retirement"

[features]
default = ["postgres", "sqlite"]
postgres = ["sqlx/postgres"]
sqlite = ["sqlx/sqlite"]

[dependencies]
nativeweave-data-contracts = { path = "../interfaces" }
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "migrate"] }
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
futures-util = { version = "=0.3.34", default-features = false, features = ["std", "async-await"] }
sha2 = "=0.10.9"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
