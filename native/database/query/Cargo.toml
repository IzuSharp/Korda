[package]
name = "nativeweave-query-native"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
publish = false
description = "Bounded SeaQuery owners over canonical NativeWeave query bindings"

[dependencies]
nativeweave-query-binding = { path = "../binding" }
nativeweave-data-contracts = { path = "../interfaces" }
nativeweave-interop-abi = { path = "../../interop/abi" }
sea-query = { version = "=1.0.2", default-features = false, features = ["backend-postgres", "backend-sqlite", "thread-safe", "with-chrono", "with-rust_decimal", "with-uuid", "with-json"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
[lints.clippy]
undocumented_unsafe_blocks = "deny"
