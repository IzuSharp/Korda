[package]
name = "nativeweave-data-transactions"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
publish = false
description = "Native transaction admission, outcome, savepoint and retained cleanup coordination"

[dependencies]
nativeweave-data-contracts = { path = "../interfaces" }
tokio = { version = "=1.54.1", default-features = false, features = ["rt-multi-thread", "macros", "sync", "time"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
