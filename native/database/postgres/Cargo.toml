[package]
name = "nativeweave-data-postgres"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
nativeweave-data-contracts = { path = "../interfaces" }
nativeweave-data-codecs = { path = "../codecs" }
nativeweave-data-transactions = { path = "../transactions" }
nativeweave-interop-abi = { path = "../../interop/abi" }
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "tls-rustls-ring-native-roots", "migrate"] }
sqlx-core = { version = "=0.9.0", default-features = false }
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
futures-util = { version = "=0.3.34", default-features = false, features = ["std", "async-await"] }
url = "=2.5.8"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
[lints.clippy]
undocumented_unsafe_blocks = "deny"
