[package]
name = "nativeweave-data-codecs"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
description = "Checked NativeWeave db-wire to SQLx parameter and result codecs"

[dependencies]
sea-query = { version = "=1.0.2", default-features = false, features = ["thread-safe", "with-chrono", "with-rust_decimal", "with-uuid", "with-json"] }
nativeweave-data-contracts = { path = "../interfaces" }
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "postgres", "uuid", "chrono", "rust_decimal", "json"] }
uuid = "=1.18.1"
chrono = { version = "=0.4.42", default-features = false, features = ["std"] }
rust_decimal = { version = "=1.39.0", default-features = false, features = ["std"] }
serde_json = { version = "=1.0.154", features = ["raw_value"] }

[dev-dependencies]
sha2 = "=0.10.9"
tokio = { version = "=1.54.1", features = ["rt", "macros", "time", "net"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"

[[example]]
name = "codec-roundtrip"
path = "examples/roundtrip.rs"
