[package]
name = "nativeweave-database-host"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = ["postgres", "sqlite"]
postgres = ["dep:nativeweave-data-postgres", "nativeweave-data-migrations/postgres"]
sqlite = ["dep:nativeweave-data-sqlite", "nativeweave-data-migrations/sqlite"]

[dependencies]
nativeweave-data-migrations = { path = "../migrations", default-features = false }
nativeweave-interop-abi = { path = "../../interop/abi" }
nativeweave-interop-async = { path = "../../interop/async" }
nativeweave-interop-errors = { path = "../../interop/errors" }
nativeweave-data-contracts = { path = "../interfaces" }
nativeweave-data-codecs = { path = "../codecs" }
nativeweave-data-postgres = { path = "../postgres", optional = true }
nativeweave-data-sqlite = { path = "../sqlite", optional = true }
nativeweave-data-transactions = { path = "../transactions" }
nativeweave-data-streaming = { path = "../streaming" }
nativeweave-query-binding = { path = "../binding" }
nativeweave-query-native = { path = "../query" }
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "sqlite", "migrate"] }
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
futures-util = { version = "=0.3.34", default-features = false, features = ["std", "async-await"] }
sha2 = "=0.10.9"
serde_json = "=1.0.154"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
