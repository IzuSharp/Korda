[package]
name = "perf01-direct-protocols"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
publish = false

[workspace]

[dependencies]
bytes = "=1.12.1"
futures-core = "=0.3.34"
futures-util = { version = "=0.3.34", default-features = false, features = ["std", "async-await"] }
http = "=1.5.0"
http-body = "=1.1.0"
http-body-util = "=0.1.3"
hyper = { version = "=1.12.0", features = ["server", "http1", "http2"] }
hyper-util = { version = "=0.1.21", features = ["tokio", "server-auto", "service"] }
tokio = { version = "=1.54.1", features = ["rt", "net", "sync", "time", "macros", "io-util"] }
tokio-rustls = { version = "=0.26.4", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "=2.2.0"
tonic = { version = "=0.14.9", default-features = false, features = ["codegen"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
panic = "unwind"
