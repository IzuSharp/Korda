[package]
name = "nativeweave-postgres-fixture"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false
[lib]
crate-type = ["cdylib", "rlib"]
[workspace]
[dependencies]
nativeweave-data-postgres = { path = "../../../native/database/postgres" }
nativeweave-data-contracts = { path = "../../../native/database/interfaces" }
nativeweave-data-codecs = { path = "../../../native/database/codecs" }
nativeweave-data-transactions = { path = "../../../native/database/transactions" }
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "tls-rustls-ring-native-roots", "migrate"] }
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
futures-util = { version = "=0.3.34", default-features = false, features = ["std", "async-await"] }
serde_json = "=1.0.154"
