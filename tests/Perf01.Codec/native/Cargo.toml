[package]
name = "perf01-codec-direct"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false
license = "MIT"

[workspace]

[dependencies]
miniz_oxide = { version = "=0.9.1", default-features = false, features = ["with-alloc"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
panic = "unwind"

