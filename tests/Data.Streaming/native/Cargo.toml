[package]
name = "nativeweave-streaming-fixture"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
nativeweave-data-contracts = { path = "../../../native/database/interfaces" }
nativeweave-data-streaming = { path = "../../../native/database/streaming" }
nativeweave-data-postgres = { path = "../../../native/database/postgres" }
nativeweave-data-sqlite = { path = "../../../native/database/sqlite" }
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "sqlite"] }
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "sync", "time", "net"] }
futures-util = { version = "=0.3.34", default-features = false, features = ["std", "async-await"] }

[workspace]

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
[lints.clippy]
undocumented_unsafe_blocks = "deny"
