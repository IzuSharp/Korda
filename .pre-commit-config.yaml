repos:
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: ce4bd7270237e95464b37d808b942f02785192c4 # clang-format 23.1.5
    hooks:
      - id: clang-format
        files: '^(native/|tests/|src/Verification\.(Interop|EndToEnd)/).*\.(c|cc|cpp|cxx|h|hh|hpp|hxx)$'
        exclude: '(^|/)(third_party|vendor|generated)/|^native/interop/abi/include/nativeweave_abi_v1\.h$|^native/database/binding/nativeweave_database_binding_v1\.h$|^tests/Interop\.Abi/native/layout\.(c|cpp)$'
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 9026c9127e153371d7a78dfcb0c45ae2046a3d10 # v0.17.6
    hooks:
      - id: ruff-format
        files: '^(eng/ci|tests/Tooling)/.*\.py$'
  - repo: local
    hooks:
      - id: test-ci
        name: Verify staged ownership and run local CI tests
        language: system
        entry: bash eng/hooks/check-ci.sh
        always_run: true
        pass_filenames: false
      - id: clang-tidy
        name: Analyze the local CMake compilation database
        language: system
        entry: python3 eng/check_native.py tidy --local
        stages: [manual]
        always_run: true
        pass_filenames: false
