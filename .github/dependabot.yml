version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # CodeQL steps share a versioned configuration and must move together.
      codeql:
        patterns:
          - github/codeql-action/*
      codeql-security:
        applies-to: security-updates
        patterns:
          - github/codeql-action/*
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
