name: Focused database checks
on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        if: contains(fromJSON(inputs.plan).checks, 'generator') || contains(fromJSON(inputs.plan).checks, 'pack-api')
        with:
          global-json-file: global.json
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: contains(fromJSON(inputs.plan).checks, 'generator')
        with:
          repository: IzuSharp/NativeWeave-Design
          ref: c62cdb8aee833b6ab1a03e29a3f59f81a1b483f9
          path: artifacts/frozen-design
          persist-credentials: false
      - name: Test generated C# and its public API
        if: contains(fromJSON(inputs.plan).checks, 'generator')
        run: |
          dotnet run --project tests/Query.Generator/Query.Generator.Tests.csproj -c Release -p:RestoreLockedMode=true
          dotnet run --project tests/Query.Generator/ApiCheck -c Release -p:RestoreLockedMode=true -- "$PWD" "$PWD/artifacts/frozen-design" "$DOTNET_ROOT"
      - name: Test the MSBuild packaging task API
        if: contains(fromJSON(inputs.plan).checks, 'pack-api')
        run: dotnet run --project tests/Packaging.Release/ApiCheck -c Release -p:RestoreLockedMode=true -- "$RUNNER_TEMP/packaging-api.md"
      - name: Test archive metadata and immutability
        if: contains(fromJSON(inputs.plan).checks, 'pack-metadata') && !contains(fromJSON(inputs.plan).checks, 'elf-profile')
        working-directory: tests/Packaging.Linux
        run: python3 -m unittest test_profile.ProfileTests.test_pack_exact_edges_identity_and_immutability -v
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        if: contains(fromJSON(inputs.plan).checks, 'elf-profile')
        with:
          key: linux-x64-tools-${{ hashFiles('native/dependencies.lock.json') }}
          path: |
            artifacts/toolchain/downloads
            artifacts/dependencies/downloads
      - name: Provision pinned compiler for ELF checks
        if: contains(fromJSON(inputs.plan).checks, 'elf-profile')
        run: python3 eng/cpp_toolchain.py
      - name: Test ELF and package profiles
        if: contains(fromJSON(inputs.plan).checks, 'elf-profile')
        run: python3 -m unittest discover -s tests/Packaging.Linux -p test_profile.py -v
