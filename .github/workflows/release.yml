name: NuGet database preview
on:
  workflow_call:
    inputs:
      artifact:
        required: true
        type: string
jobs:
  publish:
    if: github.repository == 'IzuSharp/NativeWeave' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    environment: nuget
    permissions:
      contents: read
      actions: read
      id-token: write
    services:
      postgres:
        image: postgres:18.0@sha256:41fc5342eefba6cc2ccda736aaf034bbbb7c3df0fdb81516eba1ba33f360162c
        env:
          POSTGRES_USER: nativeweave
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - "127.0.0.1:5432:5432"
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      CANDIDATE: artifacts/publication/db-scope/prepared/candidate
      NUGET_SOURCE: https://api.nuget.org/v3/index.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ inputs.artifact }}
          path: artifacts/publication
      - name: Select the verified database packages in dependency order
        run: |
          PYTHONPATH=src/Packaging.Domain:src/Packaging.Release python3 - <<'PY'
          import os
          from pathlib import Path
          from model import IDS, sha, versions
          from release import compat, order
          candidate = Path(os.environ["CANDIDATE"])
          record = compat.read_json(candidate / "release.json")
          base = "0.1.0-preview." + os.environ["GITHUB_RUN_NUMBER"]
          expected = versions(base + ".1", base + ".2")
          if record["source_commit"] != os.environ["GITHUB_SHA"] or record["source_dirty"]:
              raise ValueError("Candidate does not match the merged commit")
          packages = {row["id"]: row["version"] for row in record["packages"]}
          if packages != expected:
              raise ValueError("Unexpected database package IDs or versions")
          paths = {name: candidate / "feed" / f"{name}.{packages[name]}.nupkg" for name in IDS}
          compat.validate_closure(record, paths)
          with open("artifacts/publication/packages.txt", "w") as selection:
              for item in order(record):
                  path = paths[item["id"]]
                  if sha(path) != item["upload_archive_sha256"]:
                      raise ValueError(f"Candidate hash mismatch: {path.name}")
                  print(path, file=selection)
          PY
      - id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Push database previews to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          while IFS= read -r package; do
            dotnet nuget push "$package" --source "$NUGET_SOURCE" --api-key "$NUGET_API_KEY" --skip-duplicate
          done < artifacts/publication/packages.txt
      - name: Wait for indexing and verify signed registry packages
        run: |
          PYTHONPATH=src/Packaging.Release python3 - <<'PY'
          import os, time
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.request import urlopen
          from release import compat, verify_registry
          candidate = Path(os.environ["CANDIDATE"])
          work = Path(os.environ["RUNNER_TEMP"]) / "registry"
          work.mkdir()
          policy = compat.read_json("tests/Verification.Compatibility/signature-policy.json")
          pending = list(compat.read_json(candidate / "release.json")["packages"])
          deadline = time.monotonic() + 30 * 60
          while pending:
              for item in pending.copy():
                  name, version = item["id"], item["version"]
                  filename = f"{name}.{version}.nupkg"
                  url = f"https://api.nuget.org/v3-flatcontainer/{name.lower()}/{version}/{filename.lower()}"
                  try:
                      with urlopen(url, timeout=30) as response:
                          (work / filename).write_bytes(response.read())
                  except HTTPError as error:
                      if error.code == 404:
                          continue
                      raise
                  verify_registry(candidate / "feed" / filename, work / filename, item, policy, work / name)
                  print(f"Verified {name} {version}", flush=True)
                  pending.remove(item)
              if pending:
                  if time.monotonic() + 120 > deadline:
                      raise TimeoutError([item["id"] for item in pending])
                  print("Waiting two minutes for NuGet indexing", flush=True)
                  time.sleep(120)
          PY
      - name: Run public SQLite and PostgreSQL packages in JIT and Native AOT
        env:
          NUGET_PACKAGES: ${{ runner.temp }}/public-nuget-cache
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang zlib1g-dev
          for provider in sqlite postgresql; do
            case "$provider" in
              sqlite) id=NativeWeave.Database.Sqlite; symbol=SQLITE; export B24_DATABASE="$RUNNER_TEMP/smoke.sqlite" ;;
              postgresql) id=NativeWeave.Database.PostgreSql; symbol=POSTGRES; export B24_DATABASE=postgresql://nativeweave@127.0.0.1:5432/postgres ;;
            esac
            export B24_PROVIDER="$provider"
            app="$RUNNER_TEMP/consumer-$provider"
            mkdir "$app"
            cp samples/api/packaging-domain/Program.cs global.json NuGet.Config "$app/"
            PYTHONPATH=tests/Packaging.Domain python3 - "$app" "$id" "$symbol" "0.1.0-preview.$GITHUB_RUN_NUMBER.2" <<'PY'
          from pathlib import Path
          import sys
          from consumer_cases import project
          app, package, symbol, version = sys.argv[1:]
          project(Path(app) / "Consumer.csproj", [package], {package: version}, [symbol])
          PY
            (cd "$app" && dotnet run -c Release && dotnet publish -c Release -r linux-x64 -p:PublishAot=true -o publish && ./publish/B24Consumer --require-aot)
          done
          echo "Published and consumed **0.1.0-preview.$GITHUB_RUN_NUMBER.2** for SQLite and PostgreSQL (JIT and Native AOT)." >> "$GITHUB_STEP_SUMMARY"
