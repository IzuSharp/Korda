name: DB-Perf-01 CPU diagnostics

on:
  workflow_dispatch:
  push:
    branches: [task/DB-Perf-01-linux]
    paths: [benchmarks/db-perf/cpu-profile-request.json]

permissions:
  contents: read
  actions: read

concurrency:
  group: db-perf-01-linux-cpu-profile
  cancel-in-progress: false

jobs:
  profile:
    if: github.repository == 'IzuSharp/Korda' && github.ref == 'refs/heads/task/DB-Perf-01-linux'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CI: "true"
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      NUGET_PACKAGES: ${{ github.workspace }}/artifacts/nuget-packages
      CMAKE_BUILD_PARALLEL_LEVEL: "4"
      DOTNET_EnableDiagnostics: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      DB_PERF_REQUIRED_IMAGE_VERSION: "20261116.376.1"
    steps:
      - name: Record this separate diagnostic VM and check its image
        run: |
          python3 - <<'PY'
          import json, os, platform
          from pathlib import Path
          Path(os.environ['RUNNER_TEMP'], 'db-perf-cpu-bootstrap.json').write_text(json.dumps({
              'runId': os.environ['GITHUB_RUN_ID'], 'runAttempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'ImageOS': os.environ.get('ImageOS'), 'ImageVersion': os.environ.get('ImageVersion'),
              'requiredImageVersion': os.environ['DB_PERF_REQUIRED_IMAGE_VERSION'],
              'uname': list(platform.uname()), 'acceptedLongSegments': 0,
              'separateDiagnosticVm': True, 'performanceComparisonEligible': False,
          }, indent=2) + '\n')
          PY
          test "$ImageOS" = ubuntu24
          test "$ImageVersion" = "$DB_PERF_REQUIRED_IMAGE_VERSION"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check the bounded request and identity controls
        run: |
          python3 benchmarks/db-perf/cpu_profile.py validate
          python3 benchmarks/db-perf/cpu_profile.py self-test
      - name: Read the exact existing external AOT builder source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: IzuSharp/Korda
          ref: da153c22ef1093fccc3233ec76bfda96e6cc59df
          path: profile-source
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: profile-source/global.json
          cache: true
          cache-dependency-path: |
            profile-source/global.json
            profile-source/**/packages*.lock.json
      - name: Prepare native symbol and sampling tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zstd libssl-dev zlib1g-dev binutils linux-tools-common linux-tools-generic
          mkdir -p "$NUGET_PACKAGES"
          python3 profile-source/eng/cpp_toolchain.py
      - name: Profile the original runtime and collect separate native plans
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 benchmarks/db-perf/cpu_profile.py run
          --source "$GITHUB_WORKSPACE/profile-source"
          --output "$RUNNER_TEMP/db-perf-cpu"
      - name: Preserve raw diagnostic results and failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: db-perf-cpu-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/db-perf-cpu-bootstrap.json
            ${{ runner.temp }}/db-perf-cpu/*.json
            ${{ runner.temp }}/db-perf-cpu/cpu-cells/**
            ${{ runner.temp }}/db-perf-cpu/symbols/**
            ${{ runner.temp }}/db-perf-cpu/symbol-commands/**
            ${{ runner.temp }}/db-perf-cpu/symbol-builds/**
            ${{ runner.temp }}/db-perf-cpu/database-diagnostics/**
            ${{ runner.temp }}/db-perf-cpu/download/*.json
            ${{ runner.temp }}/db-perf-cpu/download/artifact-metadata.*
            ${{ runner.temp }}/db-perf-cpu/download/runtime-zip.command.json
            ${{ runner.temp }}/db-perf-cpu/download/runtime-zip.stderr.log
            !${{ runner.temp }}/db-perf-cpu/**/pgdata/**
          retention-days: 30
          if-no-files-found: warn
