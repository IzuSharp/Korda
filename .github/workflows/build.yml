name: Linux database candidate
on:
  workflow_call:
    inputs:
      version:
        type: string
        default: 0.1.0-db-cpp.1
      plan:
        type: string
        required: true
      artifact:
        type: string
        required: true
permissions:
  contents: read
  actions: read
jobs:
  build:
    name: Build, package and Native AOT
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    services:
      postgres:
        image: ${{ (fromJSON(inputs.plan).scope != 'sqlite' || fromJSON(inputs.plan).packages[0] != null) && 'postgres:18.0@sha256:41fc5342eefba6cc2ccda736aaf034bbbb7c3df0fdb81516eba1ba33f360162c' || '' }}
        env:
          POSTGRES_USER: nativeweave
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - "127.0.0.1:5432:5432"
        options: >-
          --health-cmd "pg_isready -U nativeweave -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      CI: "true"
      NUGET_PACKAGES: ${{ github.workspace }}/artifacts/nuget-packages
      SCCACHE_IDLE_TIMEOUT: "0"
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      PACKAGE_VERSION: ${{ inputs.version }}
      NW_TEST_POSTGRES: postgresql://nativeweave@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Materialize the PR plan
        env:
          PLAN: ${{ inputs.plan }}
        run: mkdir -p artifacts && echo "$PLAN" > artifacts/plan.json
      - name: Read immutable historical database API signatures
        if: fromJSON(inputs.plan).scope != 'pack'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: IzuSharp/NativeWeave-Design
          ref: c62cdb8aee833b6ab1a03e29a3f59f81a1b483f9
          path: artifacts/frozen-design
          persist-credentials: false
      - name: Read immutable historical Core API acceptance inputs
        if: fromJSON(inputs.plan).scope == 'full'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: IzuSharp/Plan
          ref: 8afa0311f45ab8a8157fc45c51e95a0b17dd09f2
          path: artifacts/frozen-plan
          persist-credentials: false
      - name: Read fixed database-scope compatibility inputs
        if: fromJSON(inputs.plan).scope == 'full'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: IzuSharp/NativeWeave-Design
          ref: 8298dc4128b745cf1809bad0c3cf02c45eb7f522
          fetch-depth: 0
          path: artifacts/scope-design
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            global.json
            **/packages*.lock.json
      - name: Restore pinned tool downloads
        if: fromJSON(inputs.plan).scope != 'pack'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          key: linux-x64-tools-${{ hashFiles('native/dependencies.lock.json') }}
          path: |
            artifacts/toolchain/downloads
            artifacts/dependencies/downloads
      - name: Install native build prerequisites and pinned Clang tools
        if: fromJSON(inputs.plan).scope != 'pack'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zstd zlib1g-dev libssl-dev qemu-user bison flex python3-cryptography
          python3 eng/cpp_toolchain.py
          bash eng/ci/sccache.sh install
      - name: Restore compiler objects
        if: fromJSON(inputs.plan).scope != 'pack'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ~/.cache/sccache
          key: sccache-linux-x64-v017-${{ hashFiles('native/dependencies.lock.json', 'CMakePresets.json') }}-${{ fromJSON(inputs.plan).scope }}-${{ hashFiles('native/**', 'CMakeLists.txt', 'eng/task07_native.py') }}
          restore-keys: |
            sccache-linux-x64-v017-${{ hashFiles('native/dependencies.lock.json', 'CMakePresets.json') }}-${{ fromJSON(inputs.plan).scope }}-
            sccache-linux-x64-v017-${{ hashFiles('native/dependencies.lock.json', 'CMakePresets.json') }}-
      - id: pg
        if: contains(fromJSON('["full","postgresql"]'), fromJSON(inputs.plan).scope)
        run: echo "key=$(python3 eng/postgres-cache-key.py full)" >> "$GITHUB_OUTPUT"
      - name: Restore exact PostgreSQL installation
        if: steps.pg.outputs.key
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          key: postgres-full-ubuntu24-x64-${{ steps.pg.outputs.key }}
          path: artifacts/postgres-tools/install
      - name: Prepare pinned PostgreSQL tools for real TLS and process fault oracles
        if: steps.pg.outputs.key
        run: bash eng/postgres-tools.sh
      - name: Verify database workspaces, API, regressions and actual package JIT/AOT consumers
        if: fromJSON(inputs.plan).scope == 'full'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 eng/build.py verify --version "$PACKAGE_VERSION"
      - name: Run selected provider checks
        if: contains(fromJSON('["sqlite","postgresql"]'), fromJSON(inputs.plan).scope)
        env:
          PROVIDER: ${{ fromJSON(inputs.plan).scope }}
        run: |
          python3 eng/task07_native.py --output artifacts/provider-native --provider "$PROVIDER"
          ctest --preset "linux-x64-$PROVIDER" -R '^native\.selected\.abi$'
          if [ "$PROVIDER" = sqlite ]; then
            python3 tests/Data.Sqlite/verify.py --output artifacts/provider-tests --design artifacts/frozen-design --native-build artifacts/cmake/linux-x64-sqlite
          else
            python3 tests/Data.Postgres/verify.py --output artifacts/provider-tests --design-root artifacts/frozen-design --postgres-bin "$NW_POSTGRES_BIN" --native-build artifacts/cmake/linux-x64-postgresql
          fi
      - name: Reject generated source or dependency drift
        run: git diff --exit-code
      - name: Verify shared ASan and UBSan preset with leak detection enabled
        if: fromJSON(inputs.plan).scope == 'full' && fromJSON(inputs.plan).deep
        run: bash eng/verify-cpp-sanitizers.sh
      - name: Verify retained cross-version compatibility and Core property/fuzz gates
        if: fromJSON(inputs.plan).scope == 'full' && fromJSON(inputs.plan).deep
        run: |
          python3 tests/Verification.Compatibility/verify.py --evidence artifacts/cpp-compatibility --design-root artifacts/scope-design
          python3 tests/Verification.Interop/verify.py --output artifacts/cpp-interop-properties
      - name: Verify retained Core package closure and minimum CPU/runtime transfer
        if: fromJSON(inputs.plan).scope == 'full' && fromJSON(inputs.plan).deep
        run: bash eng/verify-task04-linux.sh
      - name: Reject shared packaging source or dependency drift
        run: git diff --exit-code
      - name: Verify database release recovery, no-Rust SDK consumption and runtime-only transfer
        if: fromJSON(inputs.plan).scope == 'full' && fromJSON(inputs.plan).deep
        run: bash eng/verify-task07-linux.sh
      - name: Reject database packaging source or dependency drift
        run: git diff --exit-code
      - name: Build and package C++ assets in a fresh Linux image without Rust
        if: fromJSON(inputs.plan).scope == 'full' && fromJSON(inputs.plan).deep
        run: bash eng/verify-cpp-clean.sh
      - name: Restore runner ownership of exported database evidence
        if: always()
        run: |
          db_scope_owner="$(id -u):$(id -g)"
          for db_scope_evidence in \
            artifacts/db-scope/prepared/evidence \
            artifacts/db-scope/release/evidence \
            artifacts/db-scope/runtime/evidence \
            artifacts/db-scope/evidence \
            artifacts/cpp-clean; do
            if sudo test -d "$db_scope_evidence"; then
              sudo chown -R --no-dereference "$db_scope_owner" "$db_scope_evidence"
            fi
          done
      - name: Retain verification logs and evidence
        if: always() && fromJSON(inputs.plan).scope == 'full'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nativeweave-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/logs/
            artifacts/verification.json
            artifacts/native-tidy/*.log
            artifacts/cmake/linux-x64-release/Testing/
            artifacts/cmake/linux-x64-asan-ubsan/Testing/
            artifacts/cpp-sanitizers/
            !artifacts/cpp-sanitizers/**/certificates/*.key
            artifacts/cpp-compatibility/result.json
            artifacts/cpp-compatibility/commands.json
            artifacts/cpp-compatibility/*.stdout
            artifacts/cpp-compatibility/*.stderr
            artifacts/cpp-interop-properties/result.json
            artifacts/cpp-interop-properties/*.stdout
            artifacts/cpp-interop-properties/*.stderr
            artifacts/cpp-clean/receipt.json
            artifacts/cpp-clean/image.json
            artifacts/cpp-clean/native-build/
            artifacts/cpp-clean/prepared/evidence/
            artifacts/cpp-clean/local-consumer/evidence/
            artifacts/db-scope/regressions/result.json
            artifacts/db-scope/regressions/commands.json
            artifacts/db-scope/regressions/logs/
            artifacts/db-scope/regressions/api-tool/logs/
            artifacts/db-scope/regressions/api-tool/html/logs/
            artifacts/db-scope/regression-evidence/
            artifacts/task04/
            artifacts/db-scope/native-build/manifest.json
            artifacts/db-scope/native-build/logs/
            artifacts/db-scope/native-build/compiler-provenance.txt
            artifacts/db-scope/native-build/compile_commands.json
            artifacts/db-scope/prepared/manifest.json
            artifacts/db-scope/prepared/evidence/
            artifacts/db-scope/local-consumer/evidence/
            artifacts/db-scope/database-lifecycle/
            artifacts/db-scope/database-business/
            artifacts/db-scope/migration-comparison/
            artifacts/db-scope/release/evidence/
            artifacts/db-scope/runtime/evidence/
            artifacts/db-scope/evidence/
          if-no-files-found: error
          retention-days: 14
      - name: Compose and consume the public providers
        if: fromJSON(inputs.plan).consume
        env:
          SCOPE: ${{ fromJSON(inputs.plan).scope }}
        run: |
          args=()
          case "$SCOPE" in
            full) args+=(--components artifacts/db-scope/prepared/candidate) ;;
            sqlite|postgresql) args+=(--native artifacts/provider-native/manifest.json) ;;
          esac
          python3 eng/ci/bundles.py --plan artifacts/plan.json --version "$PACKAGE_VERSION.2" "${args[@]}"
          python3 eng/ci/consume.py artifacts/public/release.json artifacts/plan.json
      - name: Verify the publication manifest against the tested integration tree
        if: fromJSON(inputs.plan).packages[0] != null
        run: python3 eng/ci/validate_public.py artifacts/public artifacts/plan.json "$PACKAGE_VERSION.2"
      - name: Compiler cache statistics
        if: always() && fromJSON(inputs.plan).scope != 'pack'
        run: bash eng/ci/sccache.sh stats
      - name: Retain the exact PR-tested public candidates
        if: fromJSON(inputs.plan).packages[0] != null
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ inputs.artifact }}
          path: artifacts/public/
          if-no-files-found: error
          retention-days: 14
