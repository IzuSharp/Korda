name: DB-Perf-01 offline CPU reports

on:
  workflow_dispatch:
  push:
    branches: [task/DB-Perf-01-linux]
    paths: [benchmarks/db-perf/cpu-report-request.json]

permissions:
  contents: read
  actions: read

concurrency:
  group: db-perf-01-linux-cpu-report
  cancel-in-progress: false

jobs:
  report:
    if: github.repository == 'IzuSharp/Korda' && github.ref == 'refs/heads/task/DB-Perf-01-linux'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: "true"
      PYTHONDONTWRITEBYTECODE: "1"
      DB_PERF_REQUIRED_IMAGE_VERSION: "20261116.376.1"
    steps:
      - name: Record the separate offline VM and check its image
        run: |
          python3 - <<'PY'
          import json, os, platform
          from pathlib import Path
          Path(os.environ['RUNNER_TEMP'], 'db-perf-cpu-report-bootstrap.json').write_text(json.dumps({
              'runId': os.environ['GITHUB_RUN_ID'], 'runAttempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'ImageOS': os.environ.get('ImageOS'), 'ImageVersion': os.environ.get('ImageVersion'),
              'requiredImageVersion': os.environ['DB_PERF_REQUIRED_IMAGE_VERSION'],
              'uname': list(platform.uname()), 'acceptedLongSegments': 0,
              'offlineReportsOnly': True, 'newSamplesRecorded': False,
          }, indent=2) + '\n')
          PY
          test "$ImageOS" = ubuntu24
          test "$ImageVersion" = "$DB_PERF_REQUIRED_IMAGE_VERSION"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check the frozen request and bounded report controls
        run: |
          python3 benchmarks/db-perf/cpu_report.py validate
          python3 benchmarks/db-perf/cpu_report.py self-test
      - name: Read the exact original identity helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: IzuSharp/Korda
          ref: 9acdc6a8cef25d6f51feaf69e553b36027ab3975
          path: report-source
          persist-credentials: false
      - name: Install the original perf release and ELF inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils linux-tools-common linux-tools-6.8.0-151-generic
      - name: Replay original samples without starting applications or databases
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 benchmarks/db-perf/cpu_report.py run
          --source "$GITHUB_WORKSPACE/report-source"
          --output "$RUNNER_TEMP/db-perf-cpu-report"
      - name: Preserve original failed reports and new recovery evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: db-perf-cpu-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/db-perf-cpu-report-bootstrap.json
            ${{ runner.temp }}/db-perf-cpu-report/*.json
            ${{ runner.temp }}/db-perf-cpu-report/original/**
            ${{ runner.temp }}/db-perf-cpu-report/reports/**
            ${{ runner.temp }}/db-perf-cpu-report/tool/**
            ${{ runner.temp }}/db-perf-cpu-report/download/*.json
            ${{ runner.temp }}/db-perf-cpu-report/download/artifact-metadata.*
            ${{ runner.temp }}/db-perf-cpu-report/download/source-zip.stderr.log
          retention-days: 30
          if-no-files-found: warn
