name: CI
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      check_paths:
        description: "Optional: replay test or documentation paths, one per line. Empty runs the full suite."
        type: string
        required: false
  schedule:
    - cron: "13 4 * * 1"
permissions:
  contents: read
  actions: read
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  plan:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      build: ${{ steps.jobs.outputs.build }}
      modules: ${{ steps.jobs.outputs.modules }}
      focused: ${{ steps.jobs.outputs.focused }}
      plan: ${{ steps.plan.outputs.plan }}
      pending: ${{ steps.plan.outputs.pending }}
      artifact: ${{ steps.plan.outputs.artifact }}
      merged: ${{ steps.promote.outputs.merged }}
      reuse: ${{ steps.promote.outputs.run }}
      from-artifact: ${{ steps.promote.outputs.artifact }}
      number: ${{ steps.promote.outputs.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json
      - name: Build CI tool and check tracked ownership
        run: |
          dotnet build eng/ci -c Release -p:RestoreLockedMode=true
          dotnet run --project eng/ci -c Release --no-build -- check-index
      - name: Test and format CI tooling
        run: |
          dotnet test tests/CI -c Release -p:RestoreLockedMode=true
          dotnet format eng/ci --no-restore --verify-no-changes
          dotnet format tests/CI --no-restore --verify-no-changes
          python3 -m unittest discover -s tests/Tooling -v
          git diff --check
      - id: plan
        run: dotnet run --project eng/ci -c Release --no-build -- github
      - id: promote
        if: github.event_name == 'push' && steps.plan.outputs.pending == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 eng/ci/promote.py
      - id: jobs
        env:
          MERGED: ${{ steps.promote.outputs.merged }}
          REUSE: ${{ steps.promote.outputs.run }}
        run: dotnet run --project eng/ci -c Release --no-build -- jobs
  build:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        scope: ${{ fromJSON(needs.plan.outputs.plan).build_scopes }}
    uses: ./.github/workflows/build.yml
    with:
      version: 0.1.0-preview.${{ github.run_number }}
      scope: ${{ matrix.scope }}
      plan: ${{ needs.plan.outputs.plan }}
      artifact: ${{ needs.plan.outputs.artifact }}
  modules:
    needs: plan
    if: needs.plan.outputs.modules == 'true'
    uses: ./.github/workflows/modules.yml
    with:
      plan: ${{ needs.plan.outputs.plan }}
      artifact: ${{ needs.plan.outputs.artifact }}
  focused:
    needs: plan
    if: needs.plan.outputs.focused == 'true'
    uses: ./.github/workflows/database-checks.yml
    with:
      plan: ${{ needs.plan.outputs.plan }}
  security:
    needs: plan
    if: github.event_name != 'push'
    uses: ./.github/workflows/security.yml
    with:
      languages: ${{ toJSON(fromJSON(needs.plan.outputs.plan).languages) }}
    permissions:
      contents: read
      pull-requests: read
      security-events: write
  verify:
    name: Verify
    needs: [plan, build, focused, modules, security]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require the selected checks
        env:
          PLAN: ${{ needs.plan.result }}
          BUILD: ${{ needs.build.result }}
          MODULES: ${{ needs.modules.result }}
          FOCUSED: ${{ needs.focused.result }}
          NEED_MODULES: ${{ needs.plan.outputs.modules }}
          NEED_FOCUSED: ${{ needs.plan.outputs.focused }}
          SECURITY: ${{ needs.security.result }}
          REQUIRED: ${{ needs.plan.outputs.build }}
        run: |
          test "$PLAN" = success
          if [ "$REQUIRED" = true ]; then test "$BUILD" = success; else test "$BUILD" = skipped; fi
          if [ "$NEED_MODULES" = true ]; then test "$MODULES" = success; else test "$MODULES" = skipped; fi
          if [ "$NEED_FOCUSED" = true ]; then test "$FOCUSED" = success; else test "$FOCUSED" = skipped; fi
          if [ "$GITHUB_EVENT_NAME" = push ]; then test "$SECURITY" = skipped; else test "$SECURITY" = success; fi
  publish:
    needs: [plan, verify]
    if: github.repository == 'IzuSharp/NativeWeave' && needs.plan.outputs.merged == 'true' && needs.plan.outputs.pending == 'true' && vars.NUGET_PUBLISH_ENABLED == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.plan).releases }}
    uses: ./.github/workflows/release.yml
    permissions:
      contents: read
      actions: read
      id-token: write
    with:
      module: ${{ matrix.module }}
      artifact: ${{ needs.plan.outputs.from-artifact || needs.plan.outputs.artifact }}${{ matrix.suffix }}
      run: ${{ needs.plan.outputs.reuse || github.run_id }}
      version: 0.1.0-preview.${{ needs.plan.outputs.number || github.run_number }}.2
      plan: ${{ needs.plan.outputs.plan }}
