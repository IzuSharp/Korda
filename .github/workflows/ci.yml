name: CI
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:
  schedule:
    - cron: "13 4 * * 1"
permissions:
  contents: read
  actions: read
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  plan:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      scope: ${{ steps.plan.outputs.scope }}
      plan: ${{ steps.plan.outputs.plan }}
      pending: ${{ steps.plan.outputs.pending }}
      deep: ${{ steps.plan.outputs.deep }}
      artifact: ${{ steps.plan.outputs.artifact }}
      merged: ${{ steps.promote.outputs.merged }}
      reuse: ${{ steps.promote.outputs.run }}
      from-artifact: ${{ steps.promote.outputs.artifact }}
      number: ${{ steps.promote.outputs.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 -m unittest discover -s tests/Tooling -v && git diff --check
      - id: plan
        run: python3 eng/ci/plan_run.py
      - id: promote
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 eng/ci/promote.py
  build:
    needs: plan
    if: needs.plan.outputs.scope != 'light' && !needs.plan.outputs.reuse && (github.event_name != 'push' || (needs.plan.outputs.merged == 'true' && needs.plan.outputs.pending == 'true'))
    uses: ./.github/workflows/build.yml
    with:
      version: 0.1.0-preview.${{ github.run_number }}
      plan: ${{ needs.plan.outputs.plan }}
      artifact: ${{ needs.plan.outputs.artifact }}
  security:
    if: github.event_name != 'push'
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      pull-requests: read
      security-events: write
  verify:
    name: Verify
    needs: [plan, build, security]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require the selected checks
        env:
          PLAN: ${{ needs.plan.result }}
          BUILD: ${{ needs.build.result }}
          SECURITY: ${{ needs.security.result }}
          REQUIRED: ${{ needs.plan.outputs.scope != 'light' && !needs.plan.outputs.reuse && (github.event_name != 'push' || (needs.plan.outputs.merged == 'true' && needs.plan.outputs.pending == 'true')) }}
        run: |
          test "$PLAN" = success
          if [ "$REQUIRED" = true ]; then test "$BUILD" = success; else test "$BUILD" = skipped; fi
          if [ "$GITHUB_EVENT_NAME" = push ]; then test "$SECURITY" = skipped; else test "$SECURITY" = success; fi
  publish:
    needs: [plan, verify]
    if: github.repository == 'IzuSharp/NativeWeave' && needs.plan.outputs.merged == 'true' && needs.plan.outputs.pending == 'true' && vars.NUGET_PUBLISH_ENABLED == 'true'
    uses: ./.github/workflows/release.yml
    permissions:
      contents: read
      actions: read
      id-token: write
    with:
      artifact: ${{ needs.plan.outputs.from-artifact || needs.plan.outputs.artifact }}
      run: ${{ needs.plan.outputs.reuse || github.run_id }}
      version: 0.1.0-preview.${{ needs.plan.outputs.number || github.run_number }}.2
      plan: ${{ needs.plan.outputs.plan }}
