name: CI
on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      version: 0.1.0-preview.${{ github.run_number }}
      compare-rust-reference: ${{ github.event_name == 'pull_request' && github.head_ref == 'task/DB-CPP-01-linux' }}
  security:
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      pull-requests: read
      security-events: write
  verify:
    name: Verify
    if: always()
    needs: [build, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      merged: ${{ steps.merge.outputs.merged }}
    steps:
      - name: Require every gate
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
        run: |
          test "$BUILD_RESULT" = success
          test "$SECURITY_RESULT" = success
      - name: Identify the merged main PR
        id: merge
        shell: bash
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls?per_page=100" |
            jq -r --arg sha "$GITHUB_SHA" '"merged=" + (any(.[][]; .merged_at != null and .base.ref == "main" and .merge_commit_sha == $sha) | tostring)' >> "$GITHUB_OUTPUT"
  publish:
    needs: [build, verify]
    if: github.repository == 'IzuSharp/NativeWeave' && needs.verify.outputs.merged == 'true' && vars.NUGET_PUBLISH_ENABLED == 'true'
    uses: ./.github/workflows/release.yml
    permissions:
      contents: read
      actions: read
      id-token: write
    with:
      artifact: ${{ needs.build.outputs.artifact }}
