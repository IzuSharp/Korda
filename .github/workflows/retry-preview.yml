name: Retry a merged preview
on:
  workflow_dispatch:
    inputs:
      pr:
        description: Merged PR number whose verified packages should be published
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  resolve:
    if: github.repository == 'IzuSharp/NativeWeave' && github.ref == 'refs/heads/main' && vars.NUGET_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      run: ${{ steps.candidate.outputs.run }}
      artifact: ${{ steps.candidate.outputs.artifact }}
      number: ${{ steps.candidate.outputs.number }}
      plan: ${{ steps.candidate.outputs.plan }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: candidate
        env:
          PR: ${{ inputs.pr }}
          GH_TOKEN: ${{ github.token }}
        run: python3 eng/ci/promote.py --retry-pr "$PR"
  publish:
    needs: resolve
    if: needs.resolve.outputs.run != ''
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve.outputs.plan).releases }}
    uses: ./.github/workflows/release.yml
    permissions:
      contents: read
      actions: read
      id-token: write
    with:
      module: ${{ matrix.module }}
      artifact: ${{ needs.resolve.outputs.artifact }}${{ matrix.suffix }}
      run: ${{ needs.resolve.outputs.run }}
      version: 0.1.0-preview.${{ needs.resolve.outputs.number }}.2
      plan: ${{ needs.resolve.outputs.plan }}
