name: Engine conformance
on:
  workflow_dispatch:
    inputs:
      reviewed-feed-run-id:
        description: Completed run in this repository containing the reviewed dependency feed
        required: true
        type: string
      reviewed-feed-artifact:
        description: Artifact containing the exact dependency nupkg files
        required: true
        default: engine-reviewed-dependencies
        type: string
permissions:
  contents: read
  actions: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: IzuSharp/NativeWeave
          ref: __NATIVEWEAVE_SDK_REVISION__
          path: pinned-nativeweave-sdk
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json
      - name: Install AOT linker prerequisites
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang zlib1g-dev
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ inputs.reviewed-feed-artifact }}
          run-id: ${{ inputs.reviewed-feed-run-id }}
          github-token: ${{ github.token }}
          path: reviewed-feed
      - name: Verify reviewed maintainer inputs and actual consumers
        run: |
          test -d reviewed-feed
          test -d pinned-nativeweave-sdk
          python3 eng/verify.py --feed reviewed-feed --sdk-root pinned-nativeweave-sdk
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: engine-conformance
          path: artifacts/conformance/
