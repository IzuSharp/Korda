[package]
name = "nativeweave-b23-direct-rust"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
publish = false

# An isolated benchmark executable, not a product provider or workspace member.
[workspace]

[dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["tokio", "http1", "http2"] }
bytes = "=1.12.1"
http = "=1.5.0"
http-body-util = "=0.1.3"
hyper = { version = "=1.12.0", features = ["server", "http1", "http2"] }
hyper-util = { version = "=0.1.21", features = ["tokio", "server-auto", "service"] }
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "net", "sync", "time", "macros", "io-util", "fs", "signal"] }
tokio-util = { version = "=0.7.20", features = ["io", "rt"] }
tower = { version = "=0.5.3", features = ["util"] }
futures-util = { version = "=0.3.34", default-features = false, features = ["std", "async-await"] }
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "postgres", "tls-rustls-ring-native-roots"] }
libsqlite3-sys = { version = "=0.37.0", default-features = false, features = ["bundled"] }
sea-query = { version = "=1.0.2", default-features = false, features = ["backend-postgres", "backend-sqlite", "thread-safe"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
hmac = "=0.13.0"
subtle = "=2.6.1"
base64 = "=0.23.1"
uuid = { version = "=1.18.1", features = ["v4"] }
form_urlencoded = "=1.2.2"
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "=0.26.4", default-features = false, features = ["ring", "tls12"] }
rustls-pemfile = "=2.2.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
panic = "unwind"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
